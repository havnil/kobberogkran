      <path d="M9 44h44q26 0 26 26v10H67V70q0-10-10-10H9z"/>
      <path d="M26 60a16 13 0 0 0 32 0z"/>
      <rect x="37" y="24" width="12" height="22"/>
      <rect x="31" y="34" width="24" height="6" rx="2"/>
      <rect x="26" y="16" width="34" height="9" rx="4.5"/>
      <circle cx="26" cy="20.5" r="7"/>
      <circle cx="60" cy="20.5" r="7"/>
      <rect x="39" y="8" width="8" height="12" rx="3"/>
    </g>
  </defs>
  <rect width="800" height="1000" fill="#F7F2EC"/>
  <circle cx="610" cy="170" r="110" fill="#F9C9A0"/>
  <g fill="#8F8C6E">
    <use href="#gran" transform="translate(690 300) scale(1.3)"/><use href="#gran" transform="translate(740 300) scale(1.8)"/><use href="#gran" transform="translate(790 300) scale(1.1)"/>
  </g>
  <path d="M0 880h800v120H0z" fill="#DCC193"/>
  <path d="M0 880h800" stroke="#CFB07C" stroke-width="6"/>
  <ellipse cx="400" cy="896" rx="380" ry="20" fill="#4A2412" opacity=".15"/>

  <!-- van, side view, sliding door open -->
