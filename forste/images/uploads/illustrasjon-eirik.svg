    <path d="M438 428q80-34 162 0l16 222q-96 18-196 0z" fill="#F26A0F"/>
    <path d="M422 624q98 16 196 0v26q-96 18-196 0z" fill="#4A2412"/>
    <!-- hands -->
    <circle cx="412" cy="648" r="20" fill="#C98E66"/>
    <circle cx="626" cy="644" r="20" fill="#C98E66"/>
    <!-- neck and head -->
    <rect x="496" y="370" width="46" height="46" fill="#C98E66"/>
    <path d="M478 418q41 20 82 0" fill="#4A2412"/>
    <ellipse cx="519" cy="344" rx="46" ry="52" fill="#2E170B"/>
    <ellipse cx="472" cy="350" rx="9" ry="15" fill="#C98E66"/>
    <!-- cap, brim peeking out to the left -->
    <path d="M478 318q-40-2-54 10 8 10 56 6z" fill="#A84508"/>
    <path d="M468 330q0-60 51-62 51 2 51 62z" fill="#4A2412"/>
    <path d="M519 270q-22 20-26 60M519 270q22 20 26 60" fill="none" stroke="#6B4A38" stroke-width="3"/>
    <path d="M470 330h98" stroke-width="5"/>
    <circle cx="519" cy="270" r="6" fill="#F26A0F"/>
  </g>
  <!-- back print: white pipe and tap -->
  <path d="M478 540v-26q0-12 12-12h70" stroke="#FFFFFF" stroke-width="9" fill="none"/>
  <use href="#kran" transform="translate(556 478) scale(.48)" fill="#FFFFFF"/>
  <!-- toolbox in hand -->
  <g stroke="#2E170B" stroke-width="5" stroke-linejoin="round">
    <path d="M600 680v-20q0-12 12-12h28q12 0 12 12v20" fill="none" stroke-width="10"/>
    <rect x="570" y="676" width="116" height="84" rx="10" fill="#F26A0F"/>
    <rect x="564" y="670" width="128" height="22" rx="8" fill="#A84508"/>
    <rect x="614" y="696" width="28" height="16" rx="4" fill="#4A2412"/>
  </g>
