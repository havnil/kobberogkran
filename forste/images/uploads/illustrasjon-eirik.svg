    <path d="M-40 300h680q40 0 40 40v500q0 20-20 20H-40z" fill="#FFFFFF"/>
  </g>
  <path d="M-40 760c240-10 470-30 720-80v34c-250 46-480 70-720 76z" fill="#F26A0F"/>
  <path d="M-40 742c240-10 470-28 720-80" stroke="#4A2412" stroke-width="7" fill="none"/>
  <rect x="-40" y="820" width="728" height="40" rx="12" fill="#2E170B"/>
  <circle cx="90" cy="862" r="62" fill="#2E170B"/>
  <circle cx="90" cy="862" r="26" fill="#CDBBA9"/>
  <!-- door opening with shelves -->
  <rect x="40" y="350" width="260" height="400" rx="8" fill="#6B4A38" stroke="#4A2412" stroke-width="6"/>
  <path d="M40 460h260M40 580h260M40 690h260" stroke="#4A2412" stroke-width="8"/>
  <g stroke="#4A2412" stroke-width="4">
    <rect x="58" y="408" width="90" height="48" rx="6" fill="#F26A0F"/><rect x="156" y="418" width="80" height="38" rx="6" fill="#EFE6DC"/>
    <rect x="58" y="520" width="130" height="56" rx="6" fill="#EFE6DC"/><rect x="196" y="530" width="90" height="46" rx="6" fill="#F26A0F"/>
    <rect x="58" y="636" width="100" height="50" rx="6" fill="#F26A0F"/><rect x="166" y="646" width="62" height="40" rx="6" fill="#CDBBA9"/>
  </g>
  <path d="M80 432h50M74 548h90M80 660h56" stroke="#4A2412" stroke-width="4"/>
  <!-- coils of copper pipe on the floor of the van -->
  <g fill="none" stroke="#A84508" stroke-width="8"><circle cx="250" cy="720" r="26"/><circle cx="250" cy="720" r="16"/></g>
  <!-- logo mark on the van (rear panel) -->
  <path d="M340 470v-30q0-14 14-14h196" stroke="#F26A0F" stroke-width="14" fill="none"/>
  <path d="M362 418v16M534 418v16" stroke="#FFFFFF" stroke-width="4"/>
  <use href="#kran" transform="translate(542 368) scale(.9)" fill="#F26A0F"/>

  <!-- the plumber, seen from behind -->
  <g stroke="#2E170B" stroke-width="4" stroke-linejoin="round">
    <!-- boots and legs -->
    <rect x="440" y="858" width="66" height="34" rx="12" fill="#2E170B"/>
    <rect x="530" y="858" width="66" height="34" rx="12" fill="#2E170B"/>
    <path d="M444 620h70l-6 244h-60zM522 620h70l6 244h-62z" fill="#4A2412"/>
    <rect x="452" y="736" width="52" height="56" rx="8" fill="#2E170B"/>
    <rect x="532" y="736" width="52" height="56" rx="8" fill="#2E170B"/>
