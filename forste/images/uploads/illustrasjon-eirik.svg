    <path d="M440 430q-34 6-38 50l-14 140q0 14 14 16h20q12-2 14-14l18-130z" fill="#E05F0C"/>
    <path d="M598 430q34 6 38 50l12 136q0 14-14 16h-20q-12-2-14-14l-14-128z" fill="#E05F0C"/>
