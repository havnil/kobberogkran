<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="flis" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#EFE6DC"/>
      <path d="M0 .5h90M.5 0v90" stroke="#E3D5C5" stroke-width="3"/>
    </pattern>
    <path id="drape" d="M0 0c0 0-8 11-8 17a8 8 0 0 0 16 0C8 11 0 0 0 0z"/>
  </defs>
  <rect width="1200" height="900" fill="#F7F2EC"/>
  <path d="M120 600V140h960v460z" fill="url(#flis)"/>
  <path d="M0 600h1200v300H0z" fill="#E6D1AC"/>
  <path d="M0 600h1200" stroke="#CFB07C" stroke-width="6"/>

  <!-- worktop and basin -->
  <rect x="300" y="380" width="520" height="40" rx="8" fill="#FFFFFF" stroke="#4A2412" stroke-width="6"/>
  <path d="M360 420h400l-30 70q-8 18-28 18H418q-20 0-28-18z" fill="#FFFFFF" stroke="#4A2412" stroke-width="6"/>
  <path d="M380 404h360" stroke="#A9BDBA" stroke-width="16" stroke-linecap="round"/>
  <!-- tap -->
  <rect x="548" y="300" width="24" height="82" rx="4" fill="#B5652B" stroke="#4A2412" stroke-width="5"/>
  <path d="M560 304q0-44 54-44h18v26h-18q-26 0-26 18z" fill="#B5652B" stroke="#4A2412" stroke-width="5"/>
  <rect x="520" y="324" width="80" height="16" rx="8" fill="#4A2412"/>
  <use href="#drape" transform="translate(624 300) scale(1.6)" fill="#F26A0F"/>

  <!-- trap and drain pipe, cutaway -->
  <path d="M560 508v70q0 40 40 40q40 0 40-40v-20" fill="none" stroke="#A84508" stroke-width="30" stroke-linecap="round"/>
  <path d="M640 560h190q30 0 30 30v150" fill="none" stroke="#A84508" stroke-width="30"/>
  <path d="M636 552h194q24 0 24 24v164" fill="none" stroke="#F7883F" stroke-width="7" opacity=".7"/>
  <!-- the blockage -->
  <circle cx="845" cy="680" r="20" fill="#6B4A38"/>
  <circle cx="860" cy="700" r="14" fill="#4A2412"/>
  <circle cx="838" cy="708" r="11" fill="#8C6E54"/>
  <path d="M826 668q30-10 44 20M832 720q20 6 36-8" stroke="#CDBBA9" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- shower drain on the floor -->
  <ellipse cx="220" cy="740" rx="120" ry="34" fill="#A9BDBA" opacity=".8"/>
  <rect x="180" y="726" width="80" height="28" rx="6" fill="#CDBBA9" stroke="#4A2412" stroke-width="5"/>
  <path d="M196 740h48M196 732h48M196 748h48" stroke="#4A2412" stroke-width="3"/>

  <!-- plunger -->
  <rect x="1000" y="470" width="16" height="230" rx="6" fill="#6B4A38"/>
  <path d="M948 760q60-80 120 0z" fill="#F26A0F" stroke="#4A2412" stroke-width="6"/>
  <path d="M940 760h136" stroke="#4A2412" stroke-width="8" stroke-linecap="round"/>

  <!-- slow flow -->
  <g fill="none" stroke="#4A2412" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".5">
    <path d="M700 560h50M736 548l14 12-14 12"/>
  </g>
</svg>
