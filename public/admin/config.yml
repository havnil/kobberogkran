# Sveltia CMS configuration: https://sveltiacms.app/en/docs
# Saves commit straight to `main` (no editorial workflow) and go live after the next deploy.
backend:
  name: github
  repo: havnil/kobberogkran
  branch: main
  # TODO(runbook cloudflare-setup.md): set to the sveltia-cms-auth Worker URL
  # base_url: https://sveltia-cms-auth.<account>.workers.dev

site_url: https://kobberogkran.no
display_url: https://kobberogkran.no

media_folder: public/images/uploads
public_folder: /images/uploads

i18n:
  # Files live in src/content/pages/<locale>/<slug>.md
  structure: multiple_folders
  locales: [nb, en]
  default_locale: nb
  # Links the language versions of one page. Sveltia writes the nb slug into this
  # front matter property of every locale (the site matches pages on `translationKey`).
  canonical_slug:
    key: translationKey
    value: '{{slug}}'

collections:
  - name: pages
    label: Sider
    label_singular: Side
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    i18n: true
    # Each language gets its own file name from its own title (e.g. nb/om-oss.md, en/about.md).
    slug: '{{title | localize}}'
    summary: '{{title}}'
    fields:
      - name: title
        label: Tittel
        widget: string
        i18n: true
      - name: description
        label: Beskrivelse
        hint: Kort tekst for søkemotorer (ca. 150 tegn).
        widget: text
        i18n: true
      - name: translationKey
        label: Oversettelsesnøkkel
        # Managed by Sveltia through i18n.canonical_slug; same value in every locale.
        widget: hidden
        i18n: duplicate
      - name: locale
        label: Språk
        widget: hidden
        default: '{{locale}}'
        i18n: true
      - name: body
        label: Innhold
        hint: Gjelder ikke forsiden. Forsiden henter teksten fra «Faste tekster», så innholdet her vises ikke der.
        widget: markdown
        i18n: true

  - name: tjenester
    label: Tjenester
    label_singular: Tjeneste
    folder: src/content/tjenester
    extension: md
    format: frontmatter
    # The five services are fixed; new ones need code changes.
    create: false
    i18n: true
    slug: '{{title | localize}}'
    summary: '{{nummer}}. {{title}}'
    fields:
      - { name: title, label: Tittel, widget: string, i18n: true }
      - { name: kundeTittel, label: Tittel i kundens ord, widget: string, i18n: true }
      - { name: fagord, label: Fagord (undertittel), widget: string, i18n: true }
      - { name: nummer, label: Nummer (1-5), widget: number, value_type: int, min: 1, max: 5, i18n: duplicate }
      - { name: kort, label: Kort tekst på kortet, widget: text, i18n: true }
      - name: fakta
        label: Fakta
        widget: list
        i18n: true
        fields:
          - { name: tall, label: Tall eller stikkord, widget: string }
          - { name: tekst, label: Tekst, widget: string }
      - name: faq
        label: Spørsmål og svar
        widget: list
        i18n: true
        fields:
          - { name: sporsmal, label: Spørsmål, widget: string }
          - { name: svar, label: Svar, widget: text }
      - name: sesong
        label: Sesongtekst (hytte)
        widget: object
        required: false
        i18n: true
        fields:
          - { name: host, label: Høst og vinter, widget: string }
          - { name: var, label: Vår og sommer, widget: string }
      - name: bilder
        label: Bilder
        widget: list
        i18n: duplicate
        fields:
          - { name: src, label: Bilde, widget: image }
          - { name: plassholder, label: Plassholder (blokkerer lansering), widget: boolean, default: true }
      - { name: translationKey, label: Oversettelsesnøkkel, widget: hidden, i18n: duplicate }
      - { name: locale, label: Språk, widget: hidden, default: '{{locale}}', i18n: true }
      - { name: body, label: Innhold, widget: markdown, i18n: true }

  - name: tekster
    label: Faste tekster
    # Plain file collection (no CMS i18n): one JSON file per language, same fields.
    i18n: false
    files:
      - name: tekster_nb
        label: Tekster (norsk)
        file: src/content/tekster/nb.json
        format: json
        fields: &tekstFelt
          - { name: kvittering, label: Kvittering, widget: text }
          - { name: taptAnrop, label: Melding ved tapt anrop, widget: text }
          - { name: whatsappHilsen, label: 'WhatsApp-hilsen (bruk {tjeneste} og {kilde})', widget: text }
          - name: forside
            label: Forsiden
            widget: object
            fields:
              - name: hero
                label: Hero
                widget: object
                fields:
                  - { name: stedslinje, label: Stedslinje, widget: string }
                  - { name: tittel, label: Stor tittel, widget: string }
                  - { name: ingress, label: Én setning om posisjonen, widget: text }
                  - { name: lover, label: Tre løfter som kan holdes, widget: list, field: { name: lofte, label: Løfte, widget: string } }
              - name: tjenester
                label: Hva trenger du hjelp med?
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
              - name: varmtvann
                label: Fastpris på varmtvannstank
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - { name: arbeidMerke, label: Merke på fastprisen (arbeid), widget: string }
                  - { name: typiskTotalMerke, label: Merke på typisk totalpris, widget: string }
                  - { name: medTittel, label: Tittel - med, widget: string }
                  - { name: med, label: Det som er med, widget: list, field: { name: punkt, label: Punkt, widget: string } }
                  - { name: ikkeMedTittel, label: Tittel - ikke med, widget: string }
                  - { name: ikkeMed, label: Det som ikke er med, widget: list, field: { name: punkt, label: Punkt, widget: string } }
              - name: priser
                label: Priser i korte trekk
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - { name: timepris, label: Navn - timepris, widget: string }
                  - { name: servicebil, label: Navn - servicebil, widget: string }
                  - { name: forbruk, label: Navn - forbruk, widget: string }
                  - { name: regneeksempel, label: Tittel på regneeksempel, widget: string }
                  - { name: delerNote, label: Merknad om deler, widget: string }
              - name: steg
                label: Slik bestiller du
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - name: steg
                    label: Stegene
                    widget: list
                    fields:
                      - { name: tittel, label: Tittel, widget: string }
                      - { name: tekst, label: Tekst, widget: text }
              - name: omEirik
                label: Om Eirik
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - { name: tekst, label: Tekst, widget: text }
                  - { name: godkjenningerTittel, label: Tittel - godkjenninger, widget: string }
                  - { name: anmeldelserTittel, label: Tittel - anmeldelser, widget: string }
              - name: dokumentasjon
                label: Dokumentasjon (FDV og våtrom)
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - { name: punkter, label: Punkter, widget: list, field: { name: punkt, label: Punkt, widget: string } }
              - name: omrader
                label: Områder
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
              - name: skjema
                label: Skjemaseksjonen
                widget: object
                fields:
                  - { name: tittel, label: Tittel, widget: string }
                  - { name: merknad, label: Merknad, widget: text }
          - name: sider
            label: Tjenestesider og øvrige sider
            widget: object
            fields:
              - name: tjeneste
                label: Mal for tjenestesider
                widget: object
                fields:
                  - { name: faktaTittel, label: Tittel - fakta, widget: string }
                  - { name: sideboksTittel, label: Sideboks - tittel, widget: string }
                  - { name: sideboksTekst, label: Sideboks - tekst, widget: text }
                  - { name: faqTittel, label: Tittel - spørsmål og svar, widget: string }
                  - { name: andreTittel, label: Tittel - andre tjenester, widget: string }
                  - { name: omraderTittel, label: Tittel - steder, widget: string }
                  - { name: skjemaEyebrow, label: Over skjemaet, widget: string }
              - name: priser
                label: Prissiden
                widget: object
                fields:
                  - { name: kveldHelgNavn, label: Navn - kveld og helg, widget: string }
                  - { name: kveldHelgVerdi, label: Verdi - kveld og helg, widget: string }
                  - { name: mvaNote, label: Merknad om mva, widget: string }
              - name: bad
                label: Badsiden
                widget: object
                fields:
                  - { name: prosessTittel, label: Tittel - prosessen, widget: string }
                  - name: prosess
                    label: Stegene
                    widget: list
                    fields:
                      - { name: tittel, label: Tittel, widget: string }
                      - { name: tekst, label: Tekst, widget: text }
                  - { name: ansvarTittel, label: Tittel - ansvar, widget: string }
                  - { name: ansvar, label: Ansvar, widget: text }
              - name: kontakt
                label: Kontaktsiden
                widget: object
                fields:
                  - { name: telefonNavn, label: Navn - telefon, widget: string }
                  - { name: epostNavn, label: Navn - e-post, widget: string }
                  - { name: adresseNavn, label: Navn - adresse, widget: string }
          - name: lekkerNaa
            label: Det lekker nå
            widget: object
            fields:
              - { name: tittel, label: Tittel, widget: string }
              - { name: punkter, label: Punkter, widget: list, field: { name: punkt, label: Punkt, widget: string } }
              - { name: ingenDognvakt, label: Ærlig om døgnvakt, widget: text }
          - name: skjema
            label: Skjema
            widget: object
            fields:
              - { name: hva, label: Hva gjelder det?, widget: string }
              - { name: haster, label: Hvor haster det?, widget: string }
              - { name: hasterLekkerNaa, label: Haster - lekker nå, widget: string }
              - { name: hasterSnart, label: Haster - snart, widget: string }
              - { name: hasterKanPlanlegges, label: Haster - kan planlegges, widget: string }
              - { name: adresse, label: Adresse, widget: string }
              - { name: bruketMinPosisjon, label: Bruk min posisjon, widget: string }
              - { name: navn, label: Navn, widget: string }
              - { name: telefon, label: Telefon, widget: string }
              - { name: epost, label: E-post, widget: string }
              - { name: bilder, label: Bilder, widget: string }
              - { name: beskrivelse, label: Beskrivelse, widget: string }
              - { name: samtykkePaminnelser, label: Samtykke til servicepåminnelser, widget: string }
              - { name: send, label: Send-knapp, widget: string }
      - name: tekster_en
        label: Tekster (English)
        file: src/content/tekster/en.json
        format: json
        fields: *tekstFelt

  - name: firma
    label: Firmadata
    files:
      - name: firma
        label: Firmadata (telefon, priser, områder)
        file: src/content/firma/firma.json
        format: json
        i18n: false
        fields:
          - name: firma
            label: Firma
            widget: object
            fields:
              - { name: navn, label: Navn, widget: string }
              - { name: juridiskNavn, label: Juridisk navn, widget: string }
              - { name: telefon, label: Telefon, widget: object, fields: &verdiStr [{ name: verdi, label: Verdi, widget: string }, { name: plassholder, label: Plassholder (blokkerer lansering), widget: boolean }] }
              - { name: whatsapp, label: WhatsApp, widget: object, fields: *verdiStr }
              - { name: epost, label: E-post, widget: object, fields: *verdiStr }
              - { name: orgnr, label: Org.nr., widget: object, fields: *verdiStr }
              - { name: adresse, label: Adresse, widget: object, fields: *verdiStr }
              - name: priser
                label: Priser (kr inkl. mva)
                widget: object
                fields:
                  - { name: timepris, label: Timepris, widget: object, fields: &verdiNum [{ name: verdi, label: Verdi, widget: number, value_type: int }, { name: plassholder, label: Plassholder (blokkerer lansering), widget: boolean }] }
                  - { name: servicebil, label: Servicebil, widget: object, fields: *verdiNum }
                  - { name: forbruk, label: Forbruk, widget: object, fields: *verdiNum }
                  - { name: varmtvannstankArbeid, label: Varmtvannstank - fastpris på arbeid, widget: object, fields: *verdiNum }
                  - { name: varmtvannstankTypiskTotal, label: Varmtvannstank - typisk totalpris, widget: object, fields: *verdiNum }
              - name: omrade
                label: Område
                widget: object
                fields:
                  - { name: steder, label: Steder, widget: list, field: { name: sted, label: Sted, widget: string } }
                  - { name: maksKjoretidMin, label: Maks kjøretid (min), widget: object, fields: *verdiNum }

  - name: omtale
    label: Omtale
    label_singular: Omtale
    folder: src/content/omtale
    extension: json
    format: json
    create: true
    # Only entries with «Ekte» ticked are ever shown on the site.
    summary: '{{type}}: {{tekst}}'
    fields:
      - { name: type, label: Type, widget: select, options: [godkjenning, referanse, anmeldelse] }
      - { name: tekst, label: Tekst, widget: text }
      - { name: navn, label: Navn, widget: string, required: false }
      - { name: ekte, label: Ekte (ikke plassholder), widget: boolean, default: false }
